name: CI

# Merging into main deploys, so every pull request runs the deploy's lint, tests and build first; main's ruleset
# requires this check to pass before a merge.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main's ruleset requires a check with this exact name; rename it there too.
  check:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; a hung one fails here instead of holding the PR check for GitHub's 6 hours.
    timeout-minutes: 15
    # The deploy builds and tests with the Pages path, so a PR is checked with the same one.
    env:
      BASE_PATH: /mkmax/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
