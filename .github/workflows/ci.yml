name: CI

# Pushing to main deploys, so a pull request runs the same lint, tests and build first and shows them on the PR.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
