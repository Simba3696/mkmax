name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily, after the in-game rotations (16:00 UTC), so the shop, challenge and season schedule stays current.
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

# Each job gets only what it needs: the build, which runs npm ci and so the dependencies' install scripts, gets no
# token that can publish; only the deploy job has one. The deploy still publishes whatever the build uploads, so this
# keeps the publishing token away from dependency code; it doesn't check what the build made.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A deploy takes about a minute. A newer run cancels a hung one anyway; this ends it, as failed, when no newer
    # run comes (between daily runs) instead of after GitHub's 6 hours.
    timeout-minutes: 15
    permissions:
      contents: read
      # configure-pages reads the site's address and path.
      pages: read
    outputs:
      fell_back: ${{ steps.catalog.outputs.fell_back == 'true' || steps.events.outputs.fell_back == 'true' }}
    steps:
      # Keeps the token out of .git/config, where install scripts in dependencies could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The deployed app's address and path, from GitHub Pages itself. github.event.repository isn't set on the
      # daily scheduled run, so building them from it pointed that run at the wrong site. The event schedule
      # refresh keeps past Realm Klash weeks from the live events.json, and both refreshes fall back to the live
      # copies when MK Mobile Base fails.
      - id: pages
        uses: actions/configure-pages@v5
      - run: |
          echo "PAGES_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Refresh the MK Mobile Base catalog (names, rarities, card art). If the site is down or its data looks wrong,
      # the script fails and the copy that's live now is deployed again. The committed copy only changes when
      # someone commits it, so it's used only if the live one can't be downloaded either.
      - id: catalog
        run: |
          npm run catalog && exit 0
          echo "::warning::Catalog refresh failed; deploying the live catalog.json again"
          echo "fell_back=true" >> "$GITHUB_OUTPUT"
          curl -fsS --max-time 60 "$PAGES_URL/catalog.json" -o "$RUNNER_TEMP/catalog.json" &&
            jq -e '.items | length > 0' "$RUNNER_TEMP/catalog.json" > /dev/null &&
            mv "$RUNNER_TEMP/catalog.json" public/catalog.json ||
            echo "::warning::Couldn't download the live catalog.json either; deploying the committed one"
      # Same for MK Mobile Base's event schedule (shop packs, challenges, Realm Klash seasons).
      - id: events
        run: |
          npm run events && exit 0
          echo "::warning::Event schedule refresh failed; deploying the live events.json again"
          echo "fell_back=true" >> "$GITHUB_OUTPUT"
          curl -fsS --max-time 60 "$PAGES_URL/events.json" -o "$RUNNER_TEMP/events.json" &&
            jq -e '.packs | length > 0' "$RUNNER_TEMP/events.json" > /dev/null &&
            mv "$RUNNER_TEMP/events.json" public/events.json ||
            echo "::warning::Couldn't download the live events.json either; deploying the committed one"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Past deploy-pages' own 10-minute wait, so a slow Pages rollout fails with its message rather than this limit's.
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A deploy that kept an older catalog or event schedule still publishes, then fails here, so GitHub emails the owner
  # instead of a copy that stopped refreshing hiding behind green runs.
  fallback:
    needs: [build, deploy]
    if: needs.build.outputs.fell_back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          echo "::error::Couldn't refresh the catalog or event schedule from MK Mobile Base; an older copy was deployed"
          exit 1
