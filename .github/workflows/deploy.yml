name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily, after the in-game rotations (16:00 UTC), so the shop, challenge and season schedule stays current.
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Refresh the MK Mobile Base catalog (names, rarities, card art). If the site is down, the committed copy is used.
      - run: npm run catalog || echo "::warning::Catalog refresh failed; deploying the committed public/catalog.json"
      # Same for MK Mobile Base's event schedule (shop packs, challenges, Realm Klash seasons).
      - run: npm run events || echo "::warning::Event schedule refresh failed; deploying the committed public/events.json"
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
